# Testes unitários do app (node:test + tsx, sem banco).
# Cobrem as regras puras: dimensionamento/precificação/financeiro/Fio B das
# propostas, motor de auditoria do rateio e parser de contas de energia.
name: Testes

on:
  pull_request:
    paths:
      - "ascender-app/src/**"
      - "ascender-app/package.json"
      - "ascender-app/package-lock.json"
  push:
    branches: [main]
    paths:
      - "ascender-app/src/**"
      - "ascender-app/package.json"
      - "ascender-app/package-lock.json"

jobs:
  testes:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ascender-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # O glob em `node --test "src/**/*.test.ts"` exige Node 22+.
          node-version: "22"
          cache: npm
          cache-dependency-path: ascender-app/package-lock.json
      - run: npm ci --no-audit --no-fund
      - name: Testes unitários
        run: npm test
      - name: Typecheck
        run: ./node_modules/.bin/tsc --noEmit -p tsconfig.json
