# Override de produção: HTTPS via Caddy (Let's Encrypt automático).
#
# Pré-requisitos:
#   - Domínio com registro A apontando para o IP da VPS (ex.: gestao.ascenderenergiasolar.com)
#   - Portas 80 e 443 liberadas (firewall do sistema E do painel do provedor)
#
# Passos:
#   1) no .env: APP_BASE_URL=https://gestao.ascenderenergiasolar.com  (ativa o cookie seguro)
#   2) subir com os dois arquivos:
#        docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --build
#
# O Caddy publica 80/443, obtém/renova o TLS sozinho e faz proxy para o app pela
# rede interna do compose. O app DEIXA de ser publicado na internet (sem :3005);
# o `!reset` limpa a porta pública herdada do compose base.

services:
  app:
    ports: !reset []
    expose:
      - "3000"

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - app
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

  # Backup automático do Postgres (produção): pg_dump diário comprimido para o
  # volume `ascender_backups`, com retenção de BACKUP_RETENTION_DAYS. Local (mesmo
  # VPS) — protege contra migração ruim/corrupção/exclusão acidental. Para cópia
  # offsite (perda do VPS), ver runbook de backup. Restore: gunzip -c <arq> | psql.
  backup:
    image: postgres:16-alpine
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGPASSWORD: ascender
      BACKUP_RETENTION_DAYS: "7"
    volumes:
      - ascender_backups:/backups
    entrypoint: []
    command: >
      sh -c 'echo "[backup] serviço iniciado (retenção $${BACKUP_RETENTION_DAYS:-7}d)";
      while true; do
        ts=$$(date +%Y%m%d-%H%M%S);
        echo "[backup] pg_dump $$ts";
        if pg_dump -h db -U ascender -d ascender | gzip > /backups/ascender-$$ts.sql.gz.tmp; then
          mv /backups/ascender-$$ts.sql.gz.tmp /backups/ascender-$$ts.sql.gz;
          echo "[backup] ok: ascender-$$ts.sql.gz";
        else
          echo "[backup] FALHOU"; rm -f /backups/ascender-$$ts.sql.gz.tmp;
        fi;
        find /backups -name "*.sql.gz" -mtime +$${BACKUP_RETENTION_DAYS:-7} -delete;
        sleep 86400;
      done'

volumes:
  caddy_data:
  caddy_config:
  ascender_backups:
