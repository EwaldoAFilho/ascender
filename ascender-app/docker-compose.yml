services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ascender
      POSTGRES_PASSWORD: ascender
      POSTGRES_DB: ascender
    volumes:
      - ascender_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ascender -d ascender"]
      interval: 5s
      timeout: 5s
      retries: 12

  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file: .env
    environment:
      # Migrations/seed usam o dono (DATABASE_URL). O RUNTIME da app usa a role
      # restrita ascender_app (sem BYPASSRLS) para a RLS por tenant valer.
      DATABASE_URL: postgresql://ascender:ascender@db:5432/ascender
      APP_DATABASE_URL: postgresql://ascender_app:ascender_app@db:5432/ascender
    ports:
      - "${APP_PORT:-3000}:3000"

  # Worker único de sincronização: pg-boss (fila + cron + lock) sobre o próprio
  # Postgres — substitui os 3 loops shell. Cada cron enfileira 1 job por tenant
  # (singletonKey = job:tenant = lock contra sobreposição). Cadências: telemetria
  # 10min, faturas/rateio DG 15min, geração 6h. Conecta como DONO (DATABASE_URL,
  # sem APP_DATABASE_URL): pg-boss cria/mantém o schema `pgboss`; o isolamento por
  # tenant no sync é feito no código (withTenant/getCurrentTenantId por tenant).
  worker:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file: .env
    environment:
      DATABASE_URL: postgresql://ascender:ascender@db:5432/ascender
    entrypoint: []
    command: npm run worker
    # Dá tempo do encerramento gracioso do pg-boss (boss.stop, timeout 25s) drenar
    # um sync em andamento antes do SIGKILL. Sem isto, o default de 10s do Docker
    # mata o worker no meio de um sync longo e o job fica preso 'active' (ocupando
    # o slot stately do tenant) até expirar (~15 min).
    stop_grace_period: 35s

volumes:
  ascender_pgdata:
